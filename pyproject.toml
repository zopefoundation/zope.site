# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "zope.site"
version = "6.1.dev0"
description = "Local registries for zope component architecture"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation and contributors",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "zope.annotation",
    "zope.container",
    "zope.deprecation",
    "zope.security",
    "zope.component >= 4.5.0",
    "zope.event",
    "zope.interface >= 4.5.0",
    "zope.lifecycleevent",
    "zope.location",
]
keywords = ["zope", "component", "architecture", "local"]

[project.optional-dependencies]
test = [
    "ZODB",
    "zope.component[zcml]",
    "zope.configuration",
    "zope.security[zcml]",
    "zope.testing",
    "zope.testrunner >= 6.4",
]
docs = [
    "sphinx",
    "repoze.sphinx.autointerface",
    "sphinx_rtd_theme",
]

[project.urls]
Documentation = "https://zopesite.readthedocs.io/"
Source = "https://github.com/zopefoundation/zope.site"
Issues = "https://github.com/zopefoundation/zope.site/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/zope.site/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["zope.site"]

[tool.coverage.report]
fail_under = 100
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}
